<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="ckt — type becomes dots, and the dots lean towards a moving attractor. ColorKineType, third version.">
  <title>ckt — skweeb</title>

  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <!--
    Two stages, as v2 had two layers. `dots` sets type (or places an image),
    rules the white grid over it and finds the cells: a dataset. `motion`
    draws a sprite on every dot of a glyph and leans them towards the
    attractor. The vault carries a dataset from one to the other.
  -->
  <main class="stage-wrap">
    <canvas id="stage" width="480" height="300"></canvas>
  </main>

  <div class="bar">
    <span class="bar-name">ckt</span>
    <button class="bar-btn bar-tab" id="tab-dots" title="Stage one: type → dots [1]">dots</button>
    <button class="bar-btn bar-tab" id="tab-motion" title="Stage two: dots → motion [2]">motion</button>
    <span class="bar-sep">·</span>
    <span class="bar-dim" id="readout">loading…</span>
    <span class="bar-spacer"></span>

    <!-- dots -->
    <label class="bar-btn" for="file" data-stage="dots" title="An image to cut, from disk">Open a file</label>
    <input id="file" type="file" accept="image/*" hidden>
    <button class="bar-btn" id="make" data-stage="dots" title="Cut every entry and save the dataset [S]">Make dataset</button>

    <!--
      motion. The transport is chrome, not a parameter: it says which frame
      you are looking at, and a saved loop is every frame regardless.
    -->
    <button class="bar-btn" id="play" data-stage="motion" title="Play / pause [space]">▶</button>
    <input class="bar-scrub" id="playhead" data-stage="motion" type="range" min="0" max="0" step="1" value="0" title="Frame [← →]">
    <button class="bar-btn" id="save" data-stage="motion" title="Save this frame [S]">Save</button>
    <button class="bar-btn" id="save-loop" data-stage="motion" title="Save the loop">Save loop</button>
    <button class="bar-btn" id="save-frames" data-stage="motion" title="Save the loop, and download every frame as a zip">+ frames</button>
    <button class="bar-btn" id="emit" data-stage="motion" title="Every glyph, as a gamepad brush family">Emit family</button>

    <span class="bar-sep">·</span>
    <span class="bar-dim" id="vault-state">vault…</span>
    <span class="bar-sep">·</span>
    <span class="bar-dim bar-keys">V vault · 1 2 stages · ↑↓ glyph · space play</span>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
