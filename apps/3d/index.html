<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="3d — primitives made from their params, seen from anywhere, saved as a model.">
  <title>3d — skweeb</title>

  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <!--
    The shell from core/theme.css: the viewer, one column of drawers, and the
    bar below. The model is drawn by three.js (core/libs/three/) on the
    page's GPU device and shown on a Canvas 2D; no p5.
  -->
  <div class="app">
    <main class="app-main">
      <section class="viewer" aria-label="model">
        <div class="viewer-stage"><canvas id="stage" width="480" height="480"></canvas></div>
      </section>
      <div class="app-side" id="side"></div>
    </main>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
