    The player: the map and nothing else — no panels, no bar. What answers
    is outlined under the pointer; a sign shows over the map, a warp leads to
    another. M8's third brick; its fourth, the avatar that walks it. A module
    (main.js, S9i): it builds itself in a host and takes itself out again, so
    a scene — cluster — can mount it too. Here, alone, its host is this page.
  -->
  <script type="module">
    import { mount } from './main.js';
    mount(document.body);
  </script>
</body>
