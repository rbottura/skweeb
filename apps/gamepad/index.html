<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="GamepadDraw — Draw with a gamepad using brush sprites and symmetry patterns.">
  <title>GamepadDraw</title>

  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <!-- Loading screen (dismissed once the canvas is up, its first family decoded) -->
  <div id="loading-screen">
    <div class="loading-title">GamepadDraw</div>
    <div class="loading-bar-wrap">
      <div class="loading-bar"></div>
    </div>
    <div class="loading-sub">Loading brush sprites…</div>
  </div>

  <!--
    The gamepad is a module (main.js, C6d): it builds itself in a host and
    takes itself out again, so a scene can mount it too. Here, alone, its host
    is this page, and the loading screen goes once its canvas is up.
  -->
  <script type="module">
    import { mount } from './main.js';
    const loading = document.getElementById('loading-screen');
    const up = new MutationObserver(() => {
      if (!document.querySelector('#sketch-container canvas')) return;
      up.disconnect();
      loading.classList.add('done');
    });
    up.observe(document.body, { childList: true, subtree: true });
    mount(document.body);
  </script>
</body>
</html>
