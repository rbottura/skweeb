<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="The rig's puppet: a drawing rigged at its marks, worn — your own eyes, from the camera, at the tips of its eyestalks.">
  <title>puppet — skweeb</title>

  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <!--
    The puppet: the viewer, its drawers on the right, the bar below — or,
    with ?obs or H, the avatar alone on nothing, for OBS's Browser source.
    The camera plays into a video that is never shown: the eyes and the
    mouth are cut from it every frame. With the guides on (B), what the
    camera sees is shown small in the viewer's corner. A module (main.js,
    S9i): it builds itself in a host and takes itself out again, so a scene
    — cluster — can mount it too. Here, alone, its host is this page.
  -->
  <script type="module">
    import { mount } from './main.js';
    mount(document.body);
  </script>
</body>
</html>
